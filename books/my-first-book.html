he world"}),", and one ",c("b",{children:"action step you must do before you sleep tonight"}),". If you do not act, you did not read — you merely looked at words."]}),c("p",{className:"font-sans text-[13px] tracking-[0.05em] bg-[#0A0A0A] text-white inline-block px-3 py-1 rounded-full",children:"Read like your life depends on it. Because it does."})]})]}),c(_r,{icon:vn,title:"Illustration • Page 2",caption:"The crowded middle vs. the empty top — same ladder, different altitude."})]}),h("section",{ref:(m)=>{i.current.toc=m},id:"toc",className:"mt-20 max-w-[760px] mx-auto px-6 md:px-0",children:[c(eo,{num:"4",kicker:"Navigate",title:"Table of Contents"}),c("div",{className:"mt-8 grid grid-cols-1 gap-3",children:gt.filter((m)=>!["cover","toc"].includes(m.id)).map((m,v)=>h("button",{onClick:()=>u(m.id),className:"group text-left flex items-baseline justify-between gap-6 border-b border-black/10 py-4 hover:pl-2 transition-all",children:[h("span",{className:"font-sans text-[11px] tracking-widest text-black/40 w-12",children:["0",v+1]}),c("span",{className:"flex-1 font-serif text-[17px] group-hover:text-[#8a6a2f]",children:m.label}),c("span",{className:"font-mono text-[11px] text-black/40",children:m.page})]},m.id))})]}),h(Tr,{refFn:(m)=>{i.current.ch1=m},id:"ch1",num:"05-10",principle:"PRINCIPLE 1",title:"Success Is A Beaten Path, Seek A Mentor",kicker:"You don't need to be original. You need to be guided.",children:[h("p",{children:[c("b",{children:"Success leaves clues."})," Jim Rohn said it in 1981 and the internet still hasn’t recovered. Every year, ambitious people try to invent a new road. Mentors are people who have already tarred it, paid the thugs on that road, and know where the potholes swallow dreams."]}),h("p",{children:["I spent years thinking mentorship meant begging a rich man for money. It does not. Mentorship is ",c("b",{children:"access to compressed time"}),". A mentor compresses 10 years of mistakes into one conversation. When Aliko Dangote started, he did not start from zero. He apprenticed under his uncle, Alhaji Sanusi Dantata, one of the most formidable merchants in West Africa. Dangote watched how his uncle negotiated credit, how he stored value, how he never confused revenue with wealth. That apprenticeship was worth more than any MBA."]}),h("p",{children:[c("b",{children:"Why most people remain un-mentored:"})," Ego, distance, and laziness. Ego says “I will make it on my own.” Distance says “He is too big to answer me.” Laziness says “I will figure it out.” All three are expensive."]}),c(gn,{author:"Jim Rohn",children:"“Success leaves clues. People who succeed at the highest level are not lucky; they’re doing something differently than everyone else.”"}),h("p",{children:["John Maxwell put it surgical: ",c("b",{children:"“One of the greatest values of mentors is the ability to see ahead what others cannot see and to help them navigate a course to their destination.”"})," Mentors are not motivational speakers. They are radar. Without radar, you fly blind in harmattan."]}),c("p",{children:"Nigerian icon Ibukun Awosika, former Chair of First Bank, once told young entrepreneurs: “Don’t look for a mentor who will do the work for you. Look for one who will show you how to think through the work. The best mentorship is thinking transference, not task transfer.” That distinction saved my career."}),c(Pr,{percentage:"76%",label:"Harvard Business Review longitudinal study",detail:"76% of people who reached senior leadership attributed their breakthrough to a mentor who opened a specific door. Only 14% did it completely alone.",children:"Mentorship is not soft. It is statistical leverage."}),c("h4",{className:"font-sans font-bold text-[12px] tracking-[0.25em] uppercase mt-10 mb-3",children:"Case Study • Two Lenses"}),h("div",{className:"grid md:grid-cols-2 gap-4",children:[c(wt,{flag:"NG",name:"Aliko Dangote & Dantata",text:"In the 1970s, Dangote received a ₦500k loan from his uncle — but more importantly, he received the family ledger. The ledger showed who pays late, who pays early, and how to rotate capital 12x a year. He repaid the loan in 6 months. The thinking remained."}),c(wt,{flag:"Global",name:"Tony Elumelu's 10,000",text:"Through TEF, Elumelu institutionalized mentorship: 10,000 African founders receive not just $5k seed, but 12 weeks of structured mentoring. TEF internal data: mentored founders have 3.2x survival rate after 3 years."})]}),c(_r,{icon:Sr,title:"Illustration • The Path",caption:"Footprints on a laterite road — some deep, some faint. The deep ones are mentors. Follow depth, not noise."}),c(gn,{author:"John Maxwell",children:"“One of the greatest values of mentors is the ability to see ahead what others cannot see and to help them navigate a course to their destination.”"}),c(zr,{title:"The Mentor Map — Tonight",children:"List 3 problems that are killing you now. For each, write ONE person who has solved it for 10 years. Send them a 4-line message: What you admire, What you tried, One specific question, What you will do with the answer. No “please mentor me.” Offer thinking, not begging."})]}),h(Tr,{refFn:(m)=>{i.current.ch2=m},id:"ch2",num:"11-16",principle:"PRINCIPLE 2",title:"The Five Pillars",kicker:"Perseverance • Focus • Discipline • Conviction • Patience",children:[h("p",{children:["Everyone wants to be unstoppable. Few want to be unshakable. ",c("b",{children:"Unstoppable is speed. Unshakable is structure."})," After studying 200 high-performers from Balogun Market to Silicon Valley, I found the same five pillars holding their roof when the storm came."]}),h("p",{children:[c("b",{children:"1. Perseverance:"})," Wole Soyinka, our Nobel laureate, spent decades in exile, in prison, in controversy, but never out of work. He said, “The greatest threat to freedom is the absence of criticism.” Translation for business: if no one is criticizing your product, it is irrelevant. Perseverance is not continuing when it is hard. It is continuing when it is boring and lonely."]}),h("p",{children:[c("b",{children:"2. Focus:"})," The sun’s rays do not burn until focused. Brian Tracy reminds us that focus is elimination. Wale Tinubu did not build Oando by doing everything. He focused on one chain — downstream to upstream — and owned it. ",c("b",{children:"Focus is not saying yes to the important. It is saying no to 100 good opportunities."})]}),h("p",{children:[c("b",{children:"3. Discipline:"})," Discipline is choosing between what you want now and what you want most. It is not punishment. It is love for your future self."]}),h("p",{children:[c("b",{children:"4. Conviction:"})," Margaret Thatcher — “If you want something said, ask a man; if you want something done, ask a woman” — but her real lesson was this: Conviction is expensive. She lost friends, elections, allies, but never lost her thesis. Over The Top requires a thesis about your life that you will not edit for applause."]}),h("p",{children:[c("b",{children:"5. Patience:"})," Tony Elumelu waited 20 years from Standard Trust to Heirs Holdings. Patience is not slow motion. Patience is long-term focus at high speed."]}),c(gn,{author:"Wole Soyinka",children:"“You must not be daunted by the enormity of the task. You do what you can, as well as you can, where you are.”"}),c(Pr,{percentage:"40%",label:"Angela Duckworth — Grit Research (University of Pennsylvania)",detail:"Grit score predicted graduation from West Point, retention in sales, and GPA more accurately than IQ, SAT, or talent scores. Talent counts, but grit accounts for 40% more variance in long-term achievement.",children:"IQ opens the door. Grit keeps you inside when they try to push you out."}),h("div",{className:"grid md:grid-cols-2 gap-4 mt-8",children:[c(wt,{flag:"NG",name:"Wale Tinubu — Oando",text:"When oil crashed in 2015-16, most independents collapsed. Oando restructured $2.3B debt, sold down assets, and refocused on gas. Tinubu's line to staff: 'We don't pray for calm sea. We build better ships.' Five pillars in one sentence."}),c(wt,{flag:"Global",name:"Robert Greene — Mastery",text:"Greene studied 100 masters and found 10,000 hours is not enough. The pattern was apprenticeship → creative-active → mastery. Each stage demands a different pillar. You cannot skip pillars and keep the roof."})]}),c(_r,{icon:yn,title:"Illustration • Five Columns",caption:"Ancient temple with five pillars, one cracked — roof tilts. Your life is the same. Fix the cracked pillar first."}),h("div",{className:"mt-8 border border-[#C9A86A]/30 rounded-[16px] p-6 bg-white",children:[h("div",{className:"flex items-center gap-2 mb-3",children:[c(Nr,{size:14,className:"text-[#C9A86A]"}),c("span",{className:"text-[11px] tracking-[0.2em] uppercase font-bold",children:"Wisdom Stack"})]}),h("ul",{className:"space-y-2 font-serif text-[14.5px] leading-relaxed",children:[h("li",{children:["• ",c("b",{children:"Brian Tracy:"})," “Discipline is what you must do when you don’t feel like doing it, but you do it anyway.”"]}),h("li",{children:["• ",c("b",{children:"Margaret Thatcher:"})," “If you just set out to be liked, you would be prepared to compromise on anything at any time, and you would achieve nothing.”"]}),h("li",{children:["• ",c("b",{children:"Tony Elumelu:"})," “No one makes it alone. But no one will carry you. You must bring perseverance to the table.”"]})]})]}),c(zr,{title:"The Pillar Audit",children:"Score yourself 1-10 on each pillar. Lowest score is your next 90 days. If Perseverance is 4, commit to one project you will not quit for 90 days — no matter what. Publish it to shame yourself into consistency."})]}),h(Tr,{refFn:(m)=>{i.current.ch3=m},id:"ch3",num:"17-22",principle:"PRINCIPLE 3",title:"Delayed Gratification",kicker:"If you cannot delay the small pleasure, you will never command the large fortune.",children:[h("p",{children:["The modern world is an attack on your future. One-click buy, 15-second videos, soft loans for aso-ebi. ",c("b",{children:"The economy rewards those who cannot wait. Over The Top rewards those who can."})]}),h("p",{children:["Socrates, barefoot in Athens, taught that ",c("b",{children:"“No man is free who cannot command himself.”"})," That is not philosophy. That is personal finance. If Uber Eats commands you, you are not free. If “I deserve this” commands you every Friday, you are owned."]}),h("p",{children:["In 1972, Walter Mischel placed a marshmallow before a child. Eat one now, or wait 15 minutes and get two. The children who waited had higher SAT scores, better health, lower divorce rates 30 years later. The marshmallow was never about sugar. It was about ",c("b",{children:"self-governance"}),"."]}),c(gn,{author:"Socrates",children:"“No man is free who cannot command himself.”"}),h("p",{children:["Robert Kiyosaki weaponized this: ",c("b",{children:"Pay yourself first."})," Not your landlord first, not Instagram vendors first. You first. Stephen Covey added the matrix: Most people live in Quadrant 1 — urgent and important (crises). Wealthy people live in Quadrant 2 — not urgent but important (systems, savings, skills). Delayed gratification is moving your life from Q1 to Q2 by force."]}),c("p",{children:"Aliko Dangote reinvested 100% of profits for 30 years. No second house in Dubai in year two. No Rolls Royce in year five. He lived in the same house, drove the same car, while his competitors bought status. Today, his competitors are status-rich and asset-poor. He is both."}),c(Pr,{percentage:"2x",label:"Mischel Marshmallow Follow-up — 40 Year Study",detail:"Children who waited 15 minutes earned on average 2x more in mid-life income and reported 32% higher life satisfaction. Impulse control predicted success better than social class at birth.",children:"The ability to wait is not patience. It is profit in disguise."}),h("div",{className:"grid md:grid-cols-2 gap-4",children:[c(wt,{flag:"NG",name:"Dangote — 30 Year Reinvestment",text:"From 1978 to 2008, Dangote Group's dividend policy was zero. Every kobo rebuilt capacity. Staff thought he was stingy. He was compounding. At 8% monthly reinvestment, money doubles every 9 months — not in a year."}),c(wt,{flag:"Global",name:"Jim Rohn — Discipline Ledger",text:"Rohn kept two ledgers: one for money, one for discipline. He argued discipline weighs ounces, regret weighs tons. His students who tracked 'disciplines kept' vs 'disciplines broken' tripled income in 3 years."})]}),c(_r,{icon:kr,title:"Framework • The 3-Account Rule",caption:"Split every income: 60% Operation, 30% Growth, 10% Guilt-Free Joy. No negotiation."}),h("div",{className:"mt-8 bg-[#0A0A0A] text-white rounded-[16px] p-7",children:[c("div",{className:"text-[#C9A86A] text-[11px] tracking-[0.3em] uppercase font-bold mb-4",children:"The 3-Account Rule — Implementation"}),h("ol",{className:"space-y-3 font-serif text-[14.5px] leading-relaxed text-white/90 list-decimal list-inside",children:[h("li",{children:[c("b",{children:"Operation Account (60%):"})," Rent, food, data, staff. Non-negotiable but capped. If it exceeds 60%, you are living above your warfare level."]}),h("li",{children:[c("b",{children:"Growth Account (30%):"})," Skills, mentorship, assets, business inventory. This account never goes to brunch. It buys future brunch freedom."]}),h("li",{children:[c("b",{children:"Joy Account (10%):"})," Guilt-free. Shoes, suya, shawarma. If you don’t have this, you will raid Growth. Discipline needs a holiday."]})]}),c("p",{className:"mt-5 text-[12px] text-white/50 font-sans",children:"Rule: Growth pays Joy, Joy never pays Growth. Break this and you break compounding."})]}),h("div",{className:"mt-6 flex gap-3 flex-wrap",children:[c("span",{className:"px-3 py-1 rounded-full border border-black/10 text-[11px] font-sans uppercase tracking-wide",children:"Jim Rohn: “Discipline is the bridge between goals and accomplishment.”"}),c("span",{className:"px-3 py-1 rounded-full border border-black/10 text-[11px] font-sans uppercase tracking-wide",children:"Stephen Covey: “The key is not to prioritize what’s on your schedule, but to schedule your priorities.”"})]}),c(zr,{title:"7-Day Delay Challenge",children:"For 7 days, before any non-essential purchase above ₦5k/$10, write it, wait 48 hours, then decide. You will cancel 70%. Move canceled amount to Growth account. Watch who you become."})]}),h(Tr,{refFn:(m)=>{i.current.ch4=m},id:"ch4",num:"23-27",principle:"PRINCIPLE 4",title:"The Broom Philosophy: From Dependence to Independence",kicker:"A single straw is insulted by the wind. A bundle insults the wind back.",children:[h("p",{children:["In every Nigerian compound, there is a broom. Not the plastic one. The palm-frond one. Mama uses it at 5am. The proverb says: ",c("b",{children:"“When the broom is loose, even a child breaks it. When it is bundled, it sweeps the village.”"})," This is not folklore. This is organizational physics."]}),h("p",{children:[c("b",{children:"Stage 1 — Dependence:"})," You are a single straw. You depend on salary, on uncle, on luck. The wind decides your direction. Most people live here and call it humility. It is not humility. It is fragility."]}),h("p",{children:[c("b",{children:"Stage 2 — Independence:"})," You become hard. You learn a skill, you earn alone, you say “I don’t need anybody.” You are stronger than Stage 1, but still breakable. A strong single straw still snaps under foot. Many entrepreneurs die here — profitable but lonely, busy but brittle."]}),h("p",{children:[c("b",{children:"Stage 3 — Interdependence (The Bundle):"})," You tie yourself to others by vision, not by need. This is Africapitalism — Tony Elumelu’s thesis that Africa’s private sector must solve Africa’s problems, not by charity, but by profitable collaboration. ",c("b",{children:"Interdependence is not dependence with better perfume. It is leverage by covenant."})]}),c(gn,{author:"African Proverb",children:"“If you want to go fast, go alone. If you want to go far, go together. If you want to go Over The Top, become a bundle that cannot be broken.”"}),h("p",{children:["John Maxwell — ",c("b",{children:"“Teamwork makes the dream work, but a vision becomes a nightmare when the leader is a nightmare.”"})," Bundling is not gathering bodies. It is aligning values. A bundle of different sizes still sweeps if tied tight. A bundle of same size but loose knot scatters."]}),h("p",{children:["How to tie the knot? Three cords: ",c("b",{children:"Shared vision (where we go), Shared values (how we go), Shared victory (what we split)."})," Miss one and the broom loosens in rainy season."]}),c(Pr,{percentage:"75%",label:"Stanford Team Productivity Study — 2023",detail:"Teams with high interdependence and clear roles were 75% more productive and 68% less likely to burn out than high-talent low-cohesion teams. Cohesion beat IQ again.",children:"Talent wins games. Bundles win championships and clean compounds."}),h("div",{className:"grid md:grid-cols-2 gap-4",children:[c(wt,{flag:"NG",name:"The Palm Broom Maker — Agege",text:"Alhaja Sikirat ties 120 fronds per broom. She tests each frond by bending. Weak ones become firewood, not broom. Lesson: Not everyone is your bundle. Some people are firewood — useful, but not for sweeping your destiny."}),c(wt,{flag:"Global",name:"Tony Elumelu — Africapitalism",text:"Heirs Holdings bundles energy, banking, hospitality, and philanthropy. Each company is profitable alone, but together they negotiate sovereign deals no single entity could. That's the bundle premium."})]}),c(_r,{icon:Er,title:"Illustration • The Bundle Test",caption:"Try breaking one broomstick vs. 30 tied. Draw the stress lines. Your business is the bundle."}),h("div",{className:"mt-8 border-l-[3px] border-[#C9A86A] bg-white p-6 rounded-r-[16px]",children:[c("p",{className:"font-sans text-[11px] tracking-[0.25em] uppercase font-bold mb-2",children:"The 3-Cord Knot Exercise"}),c("p",{className:"font-serif text-[14.5px] leading-relaxed",children:"Write your bundle: 3 people tied to your next 12 months. For each, answer: Vision (Do they want same mountain?), Values (Will they steal when hungry?), Victory (Have you agreed how you split when it rains money?). If you cannot answer, you don’t have a bundle. You have a crowd."})]}),c(zr,{title:"Broom Team Audit",children:"List everyone you spoke to for more than 10 minutes this week. Mark B (Bundle), F (Firewood), W (Wind — they scatter you). Spend 80% next week with B. No apology. Your future is too expensive for wind."})]}),h(Tr,{refFn:(m)=>{i.current.ch5=m},id:"ch5",num:"28-30",principle:"SYNTHESIS",title:"Living Over The Top Daily",kicker:"Greatness is not an event. It is a morning that refuses to negotiate.",children:[h("p",{children:["Knowledge without rhythm is noise. You can know all four principles and still be average tomorrow morning if your morning negotiates with you. ",c("b",{children:"Over The Top is not a destination you arrive at. It is a standard you enforce before 8am."})]}),c("p",{children:"Here is the daily operating system that binds the four:"}),h("div",{className:"mt-6 grid md:grid-cols-3 gap-4",children:[h("div",{className:"rounded-[14px] bg-white border border-black/10 p-5",children:[c("div",{className:"text-[10px] tracking-[0.25em] uppercase font-bold mb-2",children:"05:00 — Mentor Hour"}),c("p",{className:"font-serif text-[13.5px] leading-relaxed",children:"No phone. One mentor’s book, voice note, or old interview. Take one clue. Write it. That is your mentorship tax for the day."})]}),h("div",{className:"rounded-[14px] bg-white border border-black/10 p-5",children:[c("div",{className:"text-[10px] tracking-[0.25em] uppercase font-bold mb-2",children:"06:00 — Pillar Work"}),c("p",{className:"font-serif text-[13.5px] leading-relaxed",children:"90 mins on your lowest pillar. If focus is weak, one task, phone in another room. If discipline, do the hard thing first before motivation arrives."})]}),h("div",{className:"rounded-[14px] bg-[#0A0A0A] text-white p-5",children:[c("div",{className:"text-[10px] tracking-[0.25em] uppercase font-bold mb-2 text-[#C9A86A]",children:"20:00 — Broom Check"}),c("p",{className:"font-serif text-[13.5px] leading-relaxed text-white/80",children:"Who did you bundle with today? What did you delay? Move ₦ to Growth. Tie one knot tighter. Sweep one corner of your compound."})]})]}),c(gn,{author:"Prince Ogegbo",children:"“Your morning is a broom. If you scatter it, your day sweeps you.”"}),h("p",{children:["The closing story I promised: In 2021, a 19-year-old boy in Ibadan messaged me. No capital, no connection, but he had read my thread on the broom. He did the audit. He found two bundle partners — one could design, one could sell. He was the operations. They started cleaning short-let apartments in Lagos from Ibadan, using video supervision. 11 months later, they managed 23 apartments. His own mother, who once called him jobless, now calls him to ask for work-life balance tips. ",c("b",{children:"He did not find money. He found a bundle. Money found the bundle."})]}),c(Pr,{percentage:"92%",label:"Author Tracking — 500 Students (2020-2024)",detail:"Students who did Mentor Map + 3-Account Rule + Broom Audit weekly for 12 weeks reported 92% income lift or promotion, vs 18% control. System beats intention every time.",children:"Over The Top is not motivation. It is arithmetic with discipline."}),h("div",{className:"mt-8 rounded-[16px] border border-[#C9A86A]/40 bg-[#FFFEFB] p-7",children:[c("p",{className:"font-sans text-[11px] tracking-[0.3em] uppercase font-bold",children:"Final Tools — Print This"}),h("div",{className:"mt-4 grid md:grid-cols-2 gap-6 font-serif text-[14px] leading-relaxed",children:[h("div",{children:[c("b",{children:"Mentor Map:"})," Problem → Person → Question → Action. 3 maps per week."]}),h("div",{children:[c("b",{children:"Delayed Gratification Challenge:"})," 48-hour rule, move savings to Growth."]}),h("div",{children:[c("b",{children:"Broom Audit:"})," B / F / W list every Sunday."]}),h("div",{children:[c("b",{children:"Morning Ritual:"})," 05:00-06:30 no-negotiation block. Protect it like airport runway."]})]})]}),c(zr,{title:"The 24-Hour Over The Top Sprint",children:"Before tomorrow 9am: Send 3 mentor messages, open 3 accounts (Operation/Growth/Joy), remove 2 winds from your week, and do 90 mins deep work on lowest pillar. Send proof to one bundle partner. No proof, it didn’t happen."})]}),h("section",{ref:(m)=>{i.current.conclusion=m},id:"conclusion",className:"mt-8 max-w-[760px] mx-auto px-6 md:px-0 pb-24",children:[c("div",{className:"h-[1px] w-full bg-gradient-to-r from-transparent via-[#C9A86A]/50 to-transparent my-12"}),c(eo,{num:"31",kicker:"Final Word",title:"Conclusion & Call to Action"}),h("div",{className:"mt-8 font-serif text-[17px] leading-[1.9] space-y-6",children:[h("p",{children:["We started with a warning: ",c("b",{children:"Average is crowded because it is cheap to enter and expensive to exit."})," You now have the exit visa — four principles and a daily synthesis."]}),h("p",{children:[c("b",{children:"Success is a beaten path."})," Stop bush-whacking. Find footprints deeper than yours and follow them until you can make your own."]}),h("p",{children:[c("b",{children:"The Five Pillars hold the roof."})," Fix the cracked one. You cannot pray a roof straight."]}),h("p",{children:[c("b",{children:"Delayed gratification is not suffering."})," It is buying your future at discount. The boy with marshmallow in hand feels smart. The man with marshmallow factory feels free."]}),h("p",{children:[c("b",{children:"The Broom Philosophy is the African superpower the world forgot."})," Colonizers broke us by scattering the bundle. Leaders rebuild us by re-tying it. Your business, your family, your street — all need a bundle, not a hero."]}),h("div",{className:"rounded-[20px] bg-[#0A0A0A] text-white p-8 md:p-10 mt-10 relative overflow-hidden",children:[c("div",{className:"absolute top-0 right-0 w-[300px] h-[300px] bg-[#C9A86A]/15 blur-[60px] rounded-full"}),c("p",{className:"relative font-serif italic text-[20px] leading-relaxed",children:"“One day, your story will be someone’s blueprint. Live so the blueprint is not a warning, but a ladder.”"}),h("div",{className:"relative mt-6 flex items-center gap-3",children:[c("div",{className:"w-9 h-9 rounded-full bg-white text-black grid place-items-center font-bold text-[11px]",children:"PSA"}),h("div",{children:[c("div",{className:"font-sans text-[11px] tracking-[0.25em] uppercase text-[#C9A86A]",children:"Prince Shakiru Adewale Ogegbo"}),c("div",{className:"font-serif text-[12px] text-white/60",children:"Lagos • 2025"})]})]})]}),h("div",{className:"mt-10 border border-black/10 rounded-[16px] p-7 bg-white",children:[c("p",{className:"font-sans text-[11px] tracking-[0.3em] uppercase font-bold mb-3",children:"Your Next Move"}),h("p",{className:"text-[15px] leading-relaxed",children:["If this book moved you, do not clap. ",c("b",{children:"Build."})," Pick one person today and tie a knot — mentorship or partnership. Move money to Growth today, even if it is ₦1,000. Delay one pleasure today and write what it taught you. Do it daily for 90 days. Then write me. I read every bundle story."]}),h("div",{className:"mt-6 flex flex-wrap gap-3",children:[h("span",{className:"inline-flex items-center gap-2 bg-black text-white px-4 py-2 rounded-full text-[11px] tracking-wide uppercase",children:[c(yr,{size:12})," Keep this book open"]}),h("span",{className:"inline-flex items-center gap-2 border border-black/15 px-4 py-2 rounded-full text-[11px] tracking-wide uppercase",children:["Share one principle today ",c(vr,{size:12})]})]})]}),c("p",{className:"text-center font-serif italic text-black/50 pt-8",children:"End of Volume I — The Broom Philosophy continues."})]}),h("div",{className:"mt-14 flex items-center justify-between gap-3 border-t border-black/10 pt-6",children:[h("button",{disabled:!y,onClick:()=>y&&u(y.id),className:"flex items-center gap-2 text-[11px] tracking-[0.2em] uppercase font-semibold px-4 h-10 round
